
name: Build Windows installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build Simple Tweaks V3
        run: pyinstaller --noconfirm --clean --onefile --windowed --name SimpleTweaks simple_tweaks_v3.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: SimpleTweaks-V3-Windows
          path: dist/SimpleTweaks.exe
