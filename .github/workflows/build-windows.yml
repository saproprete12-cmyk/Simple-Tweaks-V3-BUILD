
name: Build Windows installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name SimpleTweaks simple_tweaks_v3.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: cmd
        run: iscc SimpleTweaks.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SimpleTweaks-Windows-Installer
          path: installer_output/SimpleTweaks_Setup_V3.exe
